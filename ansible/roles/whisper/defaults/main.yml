---
# whisper.cpp speech-to-text, ported from homelab-infra's whisper-lxc role.
# That role owns a container of its own; this one shares a 2-core, 4G box with
# NocoBase, so it pins a version, takes a smaller model and runs under limits.

whisper_repo: https://github.com/ggerganov/whisper.cpp.git
# A tag, never a branch: `master` makes the build unreproducible, and a rebuild
# that pulls a new upstream is not something a deployment should do silently.
whisper_version: v1.9.3

# On /data, never /. The root volume is 20G and is not where the software goes —
# see the disk note in CLAUDE.md.
whisper_dir: /data/whisper

# large-v3-turbo rather than the large-v3 the dedicated box runs: 547M against
# 1031M, and several times faster on CPU, which matters when there are two
# shared cores. Multilingual — the .en models cannot read the Russian records
# already in this database.
# Swap the name and the checksum together; the sha256 is the file's LFS oid,
# from https://huggingface.co/api/models/ggerganov/whisper.cpp/tree/main
whisper_model_name: ggml-large-v3-turbo-q5_0.bin
whisper_model_sha256: 394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
whisper_model_url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/{{ whisper_model_name }}?download=true"

# Loopback, not 0.0.0.0. The only client is on this box, and the container sits
# behind a Cloudflare tunnel — binding the LAN would publish an unauthenticated
# transcription endpoint. Set to 0.0.0.0 only with something in front of it.
whisper_bind: 127.0.0.1
whisper_port: 8080

# The whole point of colocating carefully. NocoBase peaks around 700M on a 4G
# box with no swap, so whisper gets a hard ceiling it cannot cross: exceeding it
# kills whisper, which is recoverable, instead of the kernel picking a victim.
whisper_memory_max: 1800M
# Both cores, but yielding: CPUWeight below the default 100 means whisper only
# gets the cores when NocoBase is not asking for them.
whisper_cpu_quota: 150%
whisper_cpu_weight: 20

# Threads the server decodes with. One less than the box has, so a transcription
# can never occupy every core at once.
whisper_threads: 1

# The spoken language of the audio. "auto" detects it per request.
#
# This is not a nicety on this deployment. whisper-server's own default is `en`,
# and that default does not mean "English audio transcribes best" — it means the
# decoder is *told* the audio is English whatever it actually is, so Bulgarian
# and Russian recordings come back as English-sounding nonsense or rough
# translations rather than as their own text. The multilingual model was chosen
# precisely so that would not happen (see whisper_model_name above), and leaving
# this unset threw that away.
#
# Auto-detection costs one extra pass over the first window of audio, which is
# negligible next to decoding the rest of it.
#
# Set a specific code — "bg", "ru", "en" — only where every recording really is
# that language: naming it skips detection and removes the chance of getting it
# wrong on a short or noisy opening.
whisper_language: auto

# Deliberately absent: --translate. It would render every language into English
# instead of transcribing it, which is the opposite of what a multilingual
# transcript is for. Whisper's own default is off; this comment exists because
# "auto" and "translate" get confused for each other.
