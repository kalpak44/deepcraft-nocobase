---
- name: Refuse to build on an architecture the model was not chosen for
  ansible.builtin.assert:
    that: ansible_architecture == 'x86_64'
    fail_msg: >-
      whisper.cpp is built from source here and the flags assume x86_64;
      this host reports {{ ansible_architecture }}
    quiet: true

- name: Install build dependencies
  ansible.builtin.apt:
    name: [build-essential, cmake, git]
    state: present
    update_cache: true

- name: Create the install directory
  ansible.builtin.file:
    path: "{{ whisper_dir }}"
    state: directory
    mode: "0755"

- name: Clone whisper.cpp at the pinned tag
  ansible.builtin.git:
    repo: "{{ whisper_repo }}"
    dest: "{{ whisper_dir }}"
    version: "{{ whisper_version }}"
    depth: 1
  register: _clone

- name: Download the ggml model
  ansible.builtin.get_url:
    url: "{{ whisper_model_url }}"
    dest: "{{ whisper_dir }}/models/{{ whisper_model_name }}"
    # A truncated download otherwise surfaces as a crash at load time.
    checksum: "sha256:{{ whisper_model_sha256 }}"
    mode: "0644"
    timeout: 600

# Both build steps are guarded by creations: so a rerun costs nothing. The build
# is the expensive part of this role — roughly ten minutes on two cores — and
# it must not repeat on every deployment.
- name: Configure the whisper.cpp build
  ansible.builtin.command:
    cmd: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/CMakeCache.txt"

# -j1: two parallel g++ processes on a 4G box with no swap is how a build ends
# in the OOM killer taking NocoBase with it.
- name: Build whisper-server
  ansible.builtin.command:
    cmd: cmake --build build --config Release --target whisper-server -j1
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/bin/whisper-server"

- name: Deploy the whisper-server unit
  ansible.builtin.template:
    src: whisper-server.service.j2
    dest: /etc/systemd/system/whisper-server.service
    mode: "0644"
  notify: Restart whisper-server

- name: Ensure whisper-server is running
  ansible.builtin.systemd:
    name: whisper-server
    state: started
    enabled: true
    daemon_reload: true

# So a restart triggered by the template lands before the check below, rather
# than after the play has already called the role a success.
- name: Apply any pending restart
  ansible.builtin.meta: flush_handlers

- name: Confirm whisper-server answers
  ansible.builtin.uri:
    url: "http://{{ whisper_bind }}:{{ whisper_port }}/"
    status_code: [200, 404]
  register: _whisper_check
  until: _whisper_check.status in [200, 404]
  # Loading the model off disk takes a while on first start.
  retries: 30
  delay: 5

- name: Report where whisper is listening
  ansible.builtin.debug:
    msg: >-
      whisper-server on {{ whisper_bind }}:{{ whisper_port }} with
      {{ whisper_model_name }}, capped at {{ whisper_memory_max }}
