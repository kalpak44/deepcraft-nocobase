---
# Setup only. Data operations live in their own plays so that a routine deploy
# can never move or overwrite the database:
#
#   ansible/backup.yml take a backup and fetch it
#   ansible/restore.yml restore a backup, including the CRM template
#   ansible/upgrade.yml bump the version and run migrations
- name: Configure nocobase
  hosts: nocobase
  become: true
  # gather_facts is required, not merely convenient: the Node.js role picks its
  # download from ansible_architecture and the pgdg repo from the release name.
  gather_facts: true

  # The last three are one feature in three concerns, and they must stay in this
  # order: lex_mcp is a client of playwright_mcp, which attaches over CDP to the
  # Chrome that browser runs, and each of them verifies itself by reaching the
  # one below. browser also adds a location to the nginx vhost, so it has to
  # follow nginx for the same reason webdav does.
  # docs_mcp indexes the share and verifies itself by reading it — the directory
  # and its group have to exist first, which is webdav's job.
  # webdav comes before it because it adds a location to the vhost nginx has
  # just written and verified — it needs that vhost to already exist, and nginx
  # is itself late for the reason below.
  # nginx verifies itself by proxying to a running app, so it follows nocobase.
  # whisper comes after nocobase, so a first run builds it against a box that is
  # already serving, and its ~10-minute build cannot delay the application.
  # ciela_mcp goes before it for the same reason in reverse: it is seconds of
  # work, and NocoBase's Siela employee is broken until it is running.
  roles:
    - nodejs
    - nocobase
    - ciela_mcp
    - whisper
    - nginx
    - webdav
    - docs_mcp
    - browser
    - playwright_mcp
    - lex_mcp
