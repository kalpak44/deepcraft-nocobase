name: Deploy

# The box sits on a home LAN with no WAN port open. `just deploy-ansible` joins
# the Zero Trust network first, then runs ansible over SSH. All the logic lives
# in the Justfile, so CI runs exactly what a developer runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'Justfile'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NOCOBASE_HOST: ${{ secrets.NOCOBASE_HOST }}
      NOCOBASE_SSH_PORT: ${{ secrets.NOCOBASE_SSH_PORT }}
      NOCOBASE_SSH_USER: ${{ secrets.NOCOBASE_SSH_USER }}
      NOCOBASE_SSH_PRIVATE_KEY: ${{ secrets.NOCOBASE_SSH_PRIVATE_KEY }}
      CF_TEAM_NAME: ${{ secrets.CF_TEAM_NAME }}
      CF_WARP_CLIENT_ID: ${{ secrets.CF_WARP_CLIENT_ID }}
      CF_WARP_CLIENT_SECRET: ${{ secrets.CF_WARP_CLIENT_SECRET }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DATABASE_NAME: ${{ secrets.POSTGRES_DATABASE_NAME }}
      POSTGRES_DATABASE_USERNAME: ${{ secrets.POSTGRES_DATABASE_USERNAME }}
      POSTGRES_DATABASE_PASSWORD: ${{ secrets.POSTGRES_DATABASE_PASSWORD }}
      NOCOBASE_APP_KEY: ${{ secrets.NOCOBASE_APP_KEY }}
      NOCOBASE_ROOT_EMAIL: ${{ secrets.NOCOBASE_ROOT_EMAIL }}
      NOCOBASE_ROOT_USERNAME: ${{ secrets.NOCOBASE_ROOT_USERNAME }}
      NOCOBASE_ROOT_PASSWORD: ${{ secrets.NOCOBASE_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just install-cli-tools
      - run: just deploy-ansible
      - if: failure()
        run: just check
